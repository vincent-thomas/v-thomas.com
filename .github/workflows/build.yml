name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Build
        if: github.event_name == 'pull_request'
        run: mise build

      - name: Upload preview
        id: preview
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ github.token }}
          packageManager: bun
          command: >-
            versions upload
            --preview-alias pr-${{ github.event.pull_request.number }}

      - name: Comment preview URL
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        env:
          WRANGLER_OUTPUT: ${{ steps.preview.outputs.command-output }}
        with:
          script: |
            const marker = '<!-- cloudflare-preview -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              core.info('Preview URL has already been commented on this pull request.');
              return;
            }

            const match = process.env.WRANGLER_OUTPUT?.match(
              /Version Preview Alias URL:\s*(https:\/\/[A-Za-z0-9.-]+)/
            );
            if (!match) throw new Error('Wrangler did not return a preview alias URL.');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${marker}\n🚀 Preview: ${match[1]}`,
            });

      - name: Deploy production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TF_CONFIG: ${{ vars.TF_CONFIG }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: mise run ci:deploy
