[tools]
bun = "latest"
"npm:wrangler" = "latest"
terraform = "1.16.0"

[tasks.install]
run = "bun install"

[tasks.build]
depends = ["install"]
run = "bun x astro build"

[tasks.dev]
depends = ["install"]
run = "bun x astro dev"

[tasks.preview]
depends = ["build"]
run = "bun x astro preview"


[tasks."tf:init"]
description = "Generates an execution plan for Terraform"
run = "terraform -chdir=infra init -input=false"

[tasks."tf:plan"]
depends = ["tf:init"]
description = "Generates an execution plan for Terraform"
run = "terraform -chdir=infra plan"

[tasks."tf:destroy"]
depends = ["tf:init"]
description = "Destroy Terraform-managed infrastructure"
run = "terraform -chdir=infra destroy"

[tasks."ci:deploy"]
depends = ["build", "tf:init"]
description = "Deploy the site and reconcile its Cloudflare infrastructure"
run = '''
#!/usr/bin/env bash
set -euo pipefail

if [ -z "${TF_CONFIG:-}" ]; then
  echo "TF_CONFIG is required" >&2
  exit 1
fi

deploy_tfvars="$(mktemp)"
trap 'rm -f "$deploy_tfvars"' EXIT
printf '%s\n' "$TF_CONFIG" > "$deploy_tfvars"

if ! terraform -chdir=infra state show cloudflare_worker.site >/dev/null 2>&1; then
  echo "Bootstrapping Terraform Worker resource"
  terraform -chdir=infra apply -input=false -auto-approve -target=cloudflare_worker.site -var-file="$deploy_tfvars"
fi

wrangler deploy
terraform -chdir=infra apply -input=false -auto-approve -var-file="$deploy_tfvars"
'''
